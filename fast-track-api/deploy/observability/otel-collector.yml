# OpenTelemetry Collector: single OTLP entry point for traces.
#
# Every service exports to http://otel-collector:4318 (OTEL_EXPORTER_OTLP_ENDPOINT
# in docker-compose.yml). The collector fans each span out to:
#   - Jaeger (UI http://localhost:16686)
#   - Tempo  (Grafana → Explore → Tempo, linked to Loki logs)
# Both receive the same trace ids (= correlation id without dashes).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp/tempo]
