apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Click a correlationId in a log line to search it across all services
        # (Promtail only labels `service` and `container`, so it is a text search)
        - name: correlationId
          matcherRegex: '"correlationId":"([^"]+)"'
          url: '{service=~".+"} |= "$${__value.raw}"'
          datasourceUid: loki
        # Click a traceId (added by libs/observability) to open the trace in Tempo
        - name: traceId
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span to its log lines: same service, lines that carry the trace id
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service

  # Same traces as Tempo (both fed by the OpenTelemetry Collector); Jaeger UI at http://localhost:16686
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service
