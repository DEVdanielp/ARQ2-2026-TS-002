apiVersion: 1

# Loads every JSON file in deploy/observability/dashboards/ into the "FastTrack"
# folder on startup (mounted at /etc/grafana/dashboards, see docker-compose.yml).
# Changes made in the UI are kept until the next restart; to keep them, export
# the dashboard as JSON and replace the file here.
providers:
  - name: fasttrack
    folder: FastTrack
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
