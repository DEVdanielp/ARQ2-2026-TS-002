global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]

  # PLANNED: no service exposes GET /metrics yet (libs/observability is not
  # implemented), so these targets show as DOWN. The GPS Tracking Worker has no
  # HTTP server today; it will need one only for /metrics.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gps-ingestion-api:3000
          - gps-tracking-worker:3000
          - profiles-service:3000
          - orders-service:3000
          - tracking-query-service:3000
          - notification-service:3000
